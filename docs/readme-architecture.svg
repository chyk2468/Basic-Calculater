<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Basic Calculator workflow</title><desc id="desc">A small browser calculator implemented with HTML for structure, CSS for layout, and JavaScript for button and arithmetic behavior.</desc><rect width="1200" height="400" rx="18" fill="#F1F1F1"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#CC5656">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#272727">Basic Calculator</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6D6D6D">Button input to arithmetic result</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D7D7D7"/><path d="M 300 237 L 330 237" stroke="#6D6D6D" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6D6D6D" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6D6D6D" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6D6D6D" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6D6D6D" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6D6D6D" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7D7D7" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#CC5656"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#CC5656">01 / INPUT</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#272727">Press a key</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D6D6D">Choose a digit or operator.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7D7D7" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#777777"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#777777">02 / STATE</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#272727">Update display</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D6D6D">JavaScript tracks the expression.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7D7D7" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#9A9A9A"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#9A9A9A">03 / CALCULATE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#272727">Evaluate expression</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D6D6D">Apply arithmetic operations.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7D7D7" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#CC5656"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#CC5656">04 / OUTPUT</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#272727">Show the answer</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D6D6D">Clear or continue calculating.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#CC5656">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D6D6D">Do not use eval() with untrusted input in a production calculator.</text></svg>